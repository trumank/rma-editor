[package]
name = "rma"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
three-d = { git = "https://github.com/trumank/three-d", features = ["egui-gui"] }
# three-d-asset = { version = "0.7.0", features = ["reqwest"] }
anyhow.workspace = true
serde_json = "1.0.117"
serde = { version = "1.0.203", features = ["derive"] }
egui_extras = "0.32"
log = "0.4"
futures = "0.3.30"
pretty_assertions = "1.4.0"
ordered-float = { version = "4.2.0", features = ["serde"] }
transform-gizmo-egui = "0.7.0"
enumset = "1.1.3"
asset_ser = { version = "0.1.0", path = "../../../../ue/asset_ser" }
uesave = { git = "https://github.com/trumank/uesave", version = "0.7.0" }
jmap = { git = "https://github.com/trumank/jmap", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
